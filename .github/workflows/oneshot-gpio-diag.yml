name: One-shot GPIO diagnostic patch

on:
  push:
    branches: [usb-only]
    paths:
      - .github/workflows/oneshot-gpio-diag.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: usb-only

      - name: Apply GPIO diagnostic command
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing expected source fragment: {label}")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one source fragment for {label}, found {text.count(old)}")
              return text.replace(old, new, 1)

          p = Path("main/link_main.c")
          s = p.read_text(encoding="utf-8")

          s = replace_once(s,
              "#define ADAPTER_CMD_SIGNAL_KEEPALIVE 11\n",
              "#define ADAPTER_CMD_SIGNAL_KEEPALIVE 11\n"
              "#define ADAPTER_CMD_GPIO_GET         12\n"
              "#define ADAPTER_CMD_GPIO_SET         13\n"
              "#define ADAPTER_CMD_GPIO_RELEASE     14\n",
              "GPIO command ids")

          s = replace_once(s,
              "typedef struct __attribute__((__packed__)) {\n"
              "    uint8_t status;\n"
              "    uint8_t mode;\n"
              "    uint8_t gpio;\n"
              "    uint8_t telemetry;\n"
              "    uint16_t pwm_freq_hz;\n"
              "    uint16_t pwm_pulse_us;\n"
              "    uint16_t dshot_speed;\n"
              "    uint16_t dshot_value;\n"
              "    uint16_t dshot_rate_hz;\n"
              "    uint16_t watchdog_ms;\n"
              "} SignalInfoPayload;\n",
              "typedef struct __attribute__((__packed__)) {\n"
              "    uint8_t status;\n"
              "    uint8_t mode;\n"
              "    uint8_t gpio;\n"
              "    uint8_t telemetry;\n"
              "    uint16_t pwm_freq_hz;\n"
              "    uint16_t pwm_pulse_us;\n"
              "    uint16_t dshot_speed;\n"
              "    uint16_t dshot_value;\n"
              "    uint16_t dshot_rate_hz;\n"
              "    uint16_t watchdog_ms;\n"
              "} SignalInfoPayload;\n\n"
              "typedef struct __attribute__((__packed__)) {\n"
              "    uint8_t status;\n"
              "    uint8_t gpio;\n"
              "    uint8_t level;\n"
              "    uint8_t override_active;\n"
              "} GpioInfoPayload;\n",
              "GPIO response struct")

          s = replace_once(s,
              "static volatile uint8_t link_led_activity_ticks;\n",
              "static volatile uint8_t link_led_activity_ticks;\n"
              "static volatile bool link_gpio_override_active;\n"
              "static volatile uint8_t link_gpio_override_pin;\n",
              "GPIO override state")

          s = replace_once(s,
              "        signal_generator_status_t sig;\n"
              "        signal_generator_get_status(&sig);\n\n"
              "        bool on = false;\n",
              "        signal_generator_status_t sig;\n"
              "        signal_generator_get_status(&sig);\n\n"
              "        if (\n"
              "            link_gpio_override_active &&\n"
              "            link_gpio_override_pin == (uint8_t)CONFIG_LED_PIN\n"
              "        ) {\n"
              "            ++phase;\n"
              "            vTaskDelay(pdMS_TO_TICKS(LINK_LED_TICK_MS));\n"
              "            continue;\n"
              "        }\n\n"
              "        bool on = false;\n",
              "LED manual override")

          marker = "static void link_process_signal_frame(\n"
          gpio_impl = r'''static bool link_gpio_allowed(uint8_t gpio)
          {
              /* Keep diagnostic writes away from UART, SIG and native USB pins. */
              return gpio == (uint8_t)CONFIG_LED_PIN;
          }

          static void link_fill_gpio_info(
              GpioInfoPayload *payload,
              uint8_t status,
              uint8_t gpio
          )
          {
              memset(payload, 0, sizeof *payload);
              payload->status = status;
              payload->gpio = gpio;
              if (link_gpio_allowed(gpio)) {
                  payload->level = gpio_get_level((gpio_num_t)gpio) ? 1 : 0;
                  payload->override_active =
                      link_gpio_override_active && link_gpio_override_pin == gpio ? 1 : 0;
              }
          }

          static void link_send_gpio_response(
              uint8_t command,
              uint32_t sequence,
              uint8_t status,
              uint8_t gpio
          )
          {
              uint8_t frame[8 + sizeof(AdapterHeader) + sizeof(GpioInfoPayload) + 4];
              AdapterHeader header = {
                  .version = ADAPTER_PROTOCOL_VERSION,
                  .command = command | 0x80,
                  .length = sizeof(GpioInfoPayload),
                  .sequence = sequence,
              };
              GpioInfoPayload payload;
              link_fill_gpio_info(&payload, status, gpio);

              int pos = 0;
              memcpy(frame + pos, adapter_response_magic, sizeof adapter_response_magic);
              pos += sizeof adapter_response_magic;
              memcpy(frame + pos, &header, sizeof header);
              pos += sizeof header;
              memcpy(frame + pos, &payload, sizeof payload);
              pos += sizeof payload;

              uint32_t crc = esp_crc32_le(
                  0,
                  frame + sizeof adapter_response_magic,
                  sizeof header + sizeof payload
              );
              memcpy(frame + pos, &crc, sizeof crc);
              pos += sizeof crc;
              usb_write_all(frame, pos);
          }

          static void link_process_gpio_frame(
              const AdapterHeader *header,
              const uint8_t *payload
          )
          {
              uint8_t status = ADAPTER_STATUS_OK;
              uint8_t gpio = header->length > 0 ? payload[0] : 0xffU;

              switch (header->command) {
                  case ADAPTER_CMD_GPIO_GET:
                      if (header->length != 1 || !link_gpio_allowed(gpio)) {
                          status = ADAPTER_STATUS_BAD_ARG;
                      }
                      break;

                  case ADAPTER_CMD_GPIO_SET:
                      if (
                          header->length != 2 ||
                          !link_gpio_allowed(gpio) ||
                          payload[1] > 1
                      ) {
                          status = ADAPTER_STATUS_BAD_ARG;
                          break;
                      }
                      link_gpio_override_pin = gpio;
                      link_gpio_override_active = true;
                      gpio_set_direction((gpio_num_t)gpio, GPIO_MODE_OUTPUT);
                      gpio_set_level((gpio_num_t)gpio, payload[1]);
                      break;

                  case ADAPTER_CMD_GPIO_RELEASE:
                      if (header->length != 1 || !link_gpio_allowed(gpio)) {
                          status = ADAPTER_STATUS_BAD_ARG;
                          break;
                      }
                      if (link_gpio_override_active && link_gpio_override_pin == gpio) {
                          link_gpio_override_active = false;
                      }
                      if (gpio == (uint8_t)CONFIG_LED_PIN) {
                          gpio_set_direction(CONFIG_LED_PIN, GPIO_MODE_OUTPUT);
                      }
                      break;

                  default:
                      status = ADAPTER_STATUS_BAD_ARG;
                      break;
              }

              link_send_gpio_response(header->command, header->sequence, status, gpio);
          }

          static bool link_is_gpio_command(uint8_t command)
          {
              return command >= ADAPTER_CMD_GPIO_GET &&
                  command <= ADAPTER_CMD_GPIO_RELEASE;
          }

          '''
          s = replace_once(s, marker, gpio_impl + marker, "GPIO implementation")

          s = replace_once(s,
              "        if (link_is_signal_command(header.command)) {\n"
              "            link_process_signal_frame(&header, payload);\n"
              "        } else {\n"
              "            adapter_process_frame(&header, payload);\n"
              "        }\n",
              "        if (link_is_signal_command(header.command)) {\n"
              "            link_process_signal_frame(&header, payload);\n"
              "        } else if (link_is_gpio_command(header.command)) {\n"
              "            link_process_gpio_frame(&header, payload);\n"
              "        } else {\n"
              "            adapter_process_frame(&header, payload);\n"
              "        }\n",
              "GPIO parser dispatch")

          p.write_text(s, encoding="utf-8", newline="\n")

          p = Path("tools/escape32-programmer/escape32_programmer.py")
          s = p.read_text(encoding="utf-8")

          s = replace_once(s, 'TOOL_VERSION = "1.3.0"', 'TOOL_VERSION = "1.4.0"', "tool version")

          s = replace_once(s,
              "ADAPTER_CMD_SIGNAL_KEEPALIVE = 11\n",
              "ADAPTER_CMD_SIGNAL_KEEPALIVE = 11\n"
              "ADAPTER_CMD_GPIO_GET = 12\n"
              "ADAPTER_CMD_GPIO_SET = 13\n"
              "ADAPTER_CMD_GPIO_RELEASE = 14\n",
              "host GPIO command ids")

          s = replace_once(s,
              'SIGNAL_DSHOT_STRUCT = struct.Struct("<HHHHB")\n',
              'SIGNAL_DSHOT_STRUCT = struct.Struct("<HHHHB")\nGPIO_INFO_STRUCT = struct.Struct("<BBBB")\n',
              "host GPIO struct")

          s = replace_once(s,
              "    def mode_name(self) -> str:\n"
              "        return {0: \"UART\", 1: \"PWM\", 2: \"DSHOT\"}.get(self.mode, f\"UNKNOWN({self.mode})\")\n\n",
              "    def mode_name(self) -> str:\n"
              "        return {0: \"UART\", 1: \"PWM\", 2: \"DSHOT\"}.get(self.mode, f\"UNKNOWN({self.mode})\")\n\n\n"
              "@dataclass\n"
              "class GpioInfo:\n"
              "    status: int\n"
              "    gpio: int\n"
              "    level: int\n"
              "    override_active: bool\n\n",
              "GpioInfo dataclass")

          s = replace_once(s,
              "    @staticmethod\n"
              "    def parse_signal(payload: bytes) -> SignalInfo:\n"
              "        if len(payload) != SIGNAL_INFO_STRUCT.size:\n"
              "            raise ProgrammerError(f\"Unexpected signal info length: {len(payload)}\")\n"
              "        v = SIGNAL_INFO_STRUCT.unpack(payload)\n"
              "        return SignalInfo(v[0], v[1], v[2], bool(v[3]), v[4], v[5], v[6], v[7], v[8], v[9])\n\n",
              "    @staticmethod\n"
              "    def parse_signal(payload: bytes) -> SignalInfo:\n"
              "        if len(payload) != SIGNAL_INFO_STRUCT.size:\n"
              "            raise ProgrammerError(f\"Unexpected signal info length: {len(payload)}\")\n"
              "        v = SIGNAL_INFO_STRUCT.unpack(payload)\n"
              "        return SignalInfo(v[0], v[1], v[2], bool(v[3]), v[4], v[5], v[6], v[7], v[8], v[9])\n\n"
              "    @staticmethod\n"
              "    def parse_gpio(payload: bytes) -> GpioInfo:\n"
              "        if len(payload) != GPIO_INFO_STRUCT.size:\n"
              "            raise ProgrammerError(f\"Unexpected GPIO info length: {len(payload)}\")\n"
              "        v = GPIO_INFO_STRUCT.unpack(payload)\n"
              "        return GpioInfo(v[0], v[1], v[2], bool(v[3]))\n\n",
              "GPIO parser")

          s = replace_once(s,
              "    def signal_stop(self) -> SignalInfo:\n"
              "        return self.parse_signal(self.request_raw(ADAPTER_CMD_SIGNAL_STOP))\n",
              "    def signal_stop(self) -> SignalInfo:\n"
              "        return self.parse_signal(self.request_raw(ADAPTER_CMD_SIGNAL_STOP))\n\n"
              "    def gpio_get(self, gpio: int) -> GpioInfo:\n"
              "        return self.parse_gpio(self.request_raw(ADAPTER_CMD_GPIO_GET, bytes((gpio,))))\n\n"
              "    def gpio_set(self, gpio: int, level: int) -> GpioInfo:\n"
              "        return self.parse_gpio(self.request_raw(ADAPTER_CMD_GPIO_SET, bytes((gpio, level))))\n\n"
              "    def gpio_release(self, gpio: int) -> GpioInfo:\n"
              "        return self.parse_gpio(self.request_raw(ADAPTER_CMD_GPIO_RELEASE, bytes((gpio,))))\n",
              "GPIO adapter methods")

          s = replace_once(s,
              "def validate_expectations(args, info: BootInfo, fw: Optional[FirmwareInfo]) -> None:\n",
              "def print_gpio_info(info: GpioInfo) -> None:\n"
              "    print(f\"GPIO.................... {info.gpio}\")\n"
              "    print(f\"Raw level............... {info.level}\")\n"
              "    print(f\"Manual override......... {'ON' if info.override_active else 'OFF'}\")\n\n\n"
              "def validate_expectations(args, info: BootInfo, fw: Optional[FirmwareInfo]) -> None:\n",
              "GPIO print helper")

          s = replace_once(s,
              "    sig = Escape32Adapter.parse_signal(s)\n"
              "    assert sig.mode == 2 and sig.dshot_speed == 600 and sig.dshot_value == 48\n",
              "    sig = Escape32Adapter.parse_signal(s)\n"
              "    assert sig.mode == 2 and sig.dshot_speed == 600 and sig.dshot_value == 48\n"
              "    g = Escape32Adapter.parse_gpio(GPIO_INFO_STRUCT.pack(0, 8, 1, 1))\n"
              "    assert g.gpio == 8 and g.level == 1 and g.override_active\n",
              "GPIO self-test")

          s = replace_once(s,
              "    adapter_sub.add_parser(\"release\")\n\n"
              "    signal_p = adapter_sub.add_parser(\"signal\")\n",
              "    adapter_sub.add_parser(\"release\")\n\n"
              "    gpio_p = adapter_sub.add_parser(\"gpio\")\n"
              "    gpio_sub = gpio_p.add_subparsers(dest=\"gpio_action\", required=True)\n"
              "    gpio_get = gpio_sub.add_parser(\"get\")\n"
              "    gpio_get.add_argument(\"pin\", type=int)\n"
              "    gpio_set = gpio_sub.add_parser(\"set\")\n"
              "    gpio_set.add_argument(\"pin\", type=int)\n"
              "    gpio_set.add_argument(\"level\", type=int, choices=(0, 1))\n"
              "    gpio_release = gpio_sub.add_parser(\"release\")\n"
              "    gpio_release.add_argument(\"pin\", type=int)\n\n"
              "    signal_p = adapter_sub.add_parser(\"signal\")\n",
              "GPIO CLI parser")

          s = replace_once(s,
              "        elif args.adapter_command == \"release\":\n"
              "            print_adapter_info(adapter.release())\n"
              "        elif args.adapter_command == \"signal\":\n",
              "        elif args.adapter_command == \"release\":\n"
              "            print_adapter_info(adapter.release())\n"
              "        elif args.adapter_command == \"gpio\":\n"
              "            if not 0 <= args.pin <= 255:\n"
              "                raise ProgrammerError(\"GPIO pin must be 0..255\")\n"
              "            if args.gpio_action == \"get\":\n"
              "                print_gpio_info(adapter.gpio_get(args.pin))\n"
              "            elif args.gpio_action == \"set\":\n"
              "                print_gpio_info(adapter.gpio_set(args.pin, args.level))\n"
              "            elif args.gpio_action == \"release\":\n"
              "                print_gpio_info(adapter.gpio_release(args.pin))\n"
              "        elif args.adapter_command == \"signal\":\n",
              "GPIO CLI execution")

          p.write_text(s, encoding="utf-8", newline="\n")

      - name: Python self-test
        run: |
          python -m py_compile tools/escape32-programmer/escape32_programmer.py
          python tools/escape32-programmer/escape32_programmer.py --self-test

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/link_main.c tools/escape32-programmer/escape32_programmer.py
          git commit -m "Link: add diagnostic GPIO control"
          git push origin HEAD:usb-only
